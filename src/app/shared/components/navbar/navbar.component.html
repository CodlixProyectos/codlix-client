<nav [ngClass]="{'bg-white/95 backdrop-blur-md shadow-sm py-4': isScrolled, 'bg-transparent py-6': !isScrolled}"
     class="fixed top-0 left-0 w-full z-[1000] transition-all duration-300 px-4 sm:px-8 lg:px-12">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-3 group">
      <div class="relative flex items-center justify-center">
        <!-- Lightning Icon (Fast & Modern) -->
        <svg class="w-8 h-8 text-blue-900 transform -rotate-12 group-hover:scale-110 group-hover:drop-shadow-sm transition-all duration-300" 
             fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2003/svg">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <span class="text-2xl font-bold tracking-tight text-slate-900">Codlyp</span>
    </a>

    <!-- Desktop Menu -->
    <div class="hidden lg:flex items-center gap-8">
      <a routerLink="/" routerLinkActive="text-blue-900 font-semibold" [routerLinkActiveOptions]="{exact: true}"
         class="text-sm font-medium text-slate-600 hover:text-blue-900 transition-colors">Inicio</a>
      <a (click)="scrollToServices()" 
         class="text-sm font-medium text-slate-600 hover:text-blue-900 transition-colors cursor-pointer">Servicios</a>
      <a routerLink="/portfolio" routerLinkActive="text-blue-900 font-semibold"
         class="text-sm font-medium text-slate-600 hover:text-blue-900 transition-colors">Portafolio</a>
      <a routerLink="/about" routerLinkActive="text-blue-900 font-semibold"
         class="text-sm font-medium text-slate-600 hover:text-blue-900 transition-colors">Nosotros</a>
      <a routerLink="/contact"
         class="ml-4 px-6 py-2.5 bg-blue-900 text-white text-sm font-semibold rounded-xl hover:bg-blue-800 transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5">
        Iniciar Proyecto
      </a>
    </div>

    <!-- Mobile Button -->
    <button (click)="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:text-blue-900 transition-colors">
      <svg *ngIf="!isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg *ngIf="isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" 
       class="lg:hidden absolute top-full left-0 w-full bg-white shadow-xl border-t border-slate-100 py-6 px-4 space-y-4 animate-in fade-in slide-in-from-top-4 duration-300">
    <a routerLink="/" (click)="closeMenu()" class="block text-base font-medium text-slate-700 hover:text-blue-900 px-4 py-2 rounded-lg">Inicio</a>
    <a (click)="scrollToServices()" class="block text-base font-medium text-slate-700 hover:text-blue-900 px-4 py-2 rounded-lg cursor-pointer">Servicios</a>
    <a routerLink="/portfolio" (click)="closeMenu()" class="block text-base font-medium text-slate-700 hover:text-blue-900 px-4 py-2 rounded-lg">Portafolio</a>
    <a routerLink="/about" (click)="closeMenu()" class="block text-base font-medium text-slate-700 hover:text-blue-900 px-4 py-2 rounded-lg">Nosotros</a>
    <a routerLink="/contact" (click)="closeMenu()" 
       class="block text-center w-full mt-4 px-6 py-3 bg-blue-900 text-white font-semibold rounded-xl shadow-md">
      Iniciar Proyecto
    </a>
  </div>
</nav>
