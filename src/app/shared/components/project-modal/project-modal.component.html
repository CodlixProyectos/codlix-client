<!-- Modal Backdrop -->
<div *ngIf="isOpen" 
  class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm transition-all duration-500"
  (click)="onClose()">

  <!-- Modal Content -->
  <div class="relative bg-white rounded-[2.5rem] shadow-[0_30px_60px_-15px_rgba(0,0,0,0.15)] max-w-lg w-full mx-4 border border-slate-100 overflow-hidden transform transition-all duration-500 scale-100"
    (click)="$event.stopPropagation()">

    <!-- Header Section -->
    <div class="relative px-10 pt-12 pb-8 bg-slate-50/50 border-b border-slate-100">
      <div class="flex items-center gap-5">
        <div class="p-2.5 bg-blue-50/50 rounded-xl">
          <svg class="w-6 h-6 text-blue-900 transform -rotate-12" 
               fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <h3 class="text-3xl font-bold text-slate-900 tracking-tight leading-none mb-2">¡Hola! 👋</h3>
          <p class="text-blue-900 font-bold text-xs uppercase tracking-widest">{{ projectName }}</p>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="relative px-10 pt-10 pb-12 space-y-8">
      <p class="text-slate-600 text-lg font-light leading-relaxed">
        Estás a punto de conocer una de nuestras soluciones de software a medida en **Codlyp**. ¿Te gustaría verla en acción o agendar una consultoría gratuita para tu negocio?
      </p>

      <div class="space-y-4">
        <button
          (click)="onOpenProject()"
          class="group relative w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-5 px-8 rounded-xl transition-all duration-300 shadow-lg shadow-blue-900/20 flex items-center justify-center gap-3">
          Ver Proyecto en Vivo
          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
          </svg>
        </button>

        <button
          (click)="onScheduleCall()"
          class="w-full bg-white border-2 border-slate-200 text-slate-700 hover:bg-slate-50 font-bold py-5 px-8 rounded-xl transition-all duration-300">
          Agenda una Cita Estratégica
        </button>
      </div>

      <button
        (click)="onClose()"
        class="w-full text-slate-400 hover:text-slate-600 font-bold py-2 transition-colors duration-300 text-xs uppercase tracking-[0.2em]">
        Cerrar y volver al Portafolio
      </button>
    </div>
  </div>
</div>
